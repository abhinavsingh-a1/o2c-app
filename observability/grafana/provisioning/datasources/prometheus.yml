# Grafana datasource, provisioned at startup (ADR-012). The fixed uid is referenced by
# observability/grafana/dashboards/*.json.
apiVersion: 1
datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 15s
