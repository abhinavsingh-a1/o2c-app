model_list:
  - model_name: o2c-extract
    litellm_params:
      model: openai/gpt-4.1-mini # shuts down 2027-01-14 (ADR-005, ADR-008)
      api_key: os.environ/OPENAI_API_KEY
  # Migration candidates (ml/list_models.py, compared with ml/eval_extraction.py)
  - model_name: o2c-extract-candidate
    litellm_params:
      model: openai/gpt-6-luna
      api_key: os.environ/OPENAI_API_KEY
  - model_name: o2c-extract-candidate-2
    litellm_params:
      model: openai/gpt-5.6-terra
      api_key: os.environ/OPENAI_API_KEY
  # LLM-as-judge for evaluations only (ml/judge_explanations.py): stronger than the generator.
  - model_name: o2c-judge
    litellm_params:
      model: openai/gpt-5.6-terra
      api_key: os.environ/OPENAI_API_KEY
  - model_name: o2c-embed
    litellm_params:
      model: openai/text-embedding-3-small
      api_key: os.environ/OPENAI_API_KEY

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL

litellm_settings:
  success_callback: ["langfuse"]
  failure_callback: ["langfuse"]
  # Newer reasoning models reject parameters such as temperature; drop them instead of failing.
  drop_params: true

router_settings:
  # If a call to o2c-extract fails (after retries), it is retried once on the candidate.
  fallbacks: [{ "o2c-extract": ["o2c-extract-candidate"] }]
