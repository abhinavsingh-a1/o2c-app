model_list:
  # Migrated 2026-10-22 from gpt-4.1-mini by the noise-aware rule, confirmed by a full
  # make eval with every LLM call site on gpt-6-luna (ADR-008).
  - model_name: o2c-extract
    litellm_params:
      model: openai/gpt-6-luna
      api_key: os.environ/OPENAI_API_KEY
  # The previous model, only as a fallback for o2c-extract; remove by 2027-01-06
  # (gpt-4.1-mini shuts down 2027-01-14, ADR-005, ADR-008).
  - model_name: o2c-extract-previous
    litellm_params:
      model: openai/gpt-4.1-mini
      api_key: os.environ/OPENAI_API_KEY
  # Migration candidates (ml/list_models.py, compared with ml/eval_extraction.py)
  - model_name: o2c-extract-candidate
    litellm_params:
      model: openai/gpt-6-luna
      api_key: os.environ/OPENAI_API_KEY
  - model_name: o2c-extract-candidate-low
    litellm_params:
      model: openai/gpt-6-luna
      reasoning_effort: low
      api_key: os.environ/OPENAI_API_KEY
  - model_name: o2c-extract-candidate-2
    litellm_params:
      model: openai/gpt-5.6-terra
      api_key: os.environ/OPENAI_API_KEY
  # LLM-as-judge for evaluations only (ml/judge_explanations.py): stronger than the generator.
  - model_name: o2c-judge
    litellm_params:
      model: openai/gpt-5.6-terra
      api_key: os.environ/OPENAI_API_KEY
  - model_name: o2c-embed
    litellm_params:
      model: openai/text-embedding-3-small
      api_key: os.environ/OPENAI_API_KEY

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL

litellm_settings:
  success_callback: ["langfuse"]
  failure_callback: ["langfuse"]
  # Newer reasoning models reject parameters such as temperature; drop them instead of failing.
  drop_params: true

router_settings:
  # If a call to o2c-extract fails (after retries), it is retried once on the previous
  # model (until 2027-01-06).
  fallbacks: [{ "o2c-extract": ["o2c-extract-previous"] }]
