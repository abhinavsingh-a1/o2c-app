[project]
name = "o2c"
version = "0.1.0"
requires-python = ">=3.12"

[tool.uv.workspace]
members = ["libs/*", "services/*"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8",
]
poc = [
    "faker>=40.43.0",
    "jupyterlab>=4.6.4",
    "langchain>=1.4.6",
    "langchain-openai>=1.7.2",
    "langchain-postgres>=0.0.19",
    "langchain-text-splitters>=1.1.3",
    "openai>=3.31.0",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.14.1",
    "pypdf>=6.20.1",
    "python-dotenv>=1.2.4",
    "reportlab>=5.0.1",
]

[tool.pytest.ini_options]
testpaths = ["libs", "services"]
# Services each have tests/test_app.py; importlib mode allows duplicate basenames.
addopts = ["--import-mode=importlib"]
