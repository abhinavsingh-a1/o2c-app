[project]
name = "o2c"
version = "0.1.0"
requires-python = ">=3.12"

[tool.uv.workspace]
members = ["libs/*", "services/*"]

# torch from the CPU-only index on Linux (the ML image, CI): no multi-GB CUDA libraries.
# Windows and macOS wheels on PyPI are CPU builds already.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8",
]
poc = [
    "faker>=40.43.0",
    "jupyterlab>=4.6.4",
    "langchain>=1.4.6",
    "langchain-openai>=1.7.2",
    "langchain-postgres>=0.0.19",
    "langchain-text-splitters>=1.1.3",
    "openai>=3.31.0",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.14.1",
    "pypdf>=6.20.1",
    "python-dotenv>=1.2.4",
    "reportlab>=5.0.1",
]
# E10 model training and evaluation (filled in Part B)
ml = [
    "docker>=7.2.0",
    "kfp>=2.13.0",
    "langfuse>=2.60.10",
    "mlflow-skinny==2.17.2",
    "pandas>=2.2,<3",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.1",
    "torch>=2.14.1",
    "transformers>=5.20.2,<5.21",
]
analytics = [
    "dbt-postgres>=1.9.1",
]

[tool.pytest.ini_options]
testpaths = ["libs", "services", "ml", "observability", "analytics"]
# Services each have tests/test_app.py; importlib mode allows duplicate basenames.
addopts = ["--import-mode=importlib"]
