server {
    listen 8080;
    root /usr/share/nginx/html;

    # Forward API calls to the agent; the trailing slash removes the /api prefix.
    location /api/ {
        proxy_pass http://agent:8400/;
        proxy_set_header Host $host;
        client_max_body_size 20m;
    }

    # Single-page app: every unknown path loads index.html, React Router takes over.
    location / {
        try_files $uri /index.html;
    }
}
