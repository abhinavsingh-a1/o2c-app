server {
    listen 8080;
    root /usr/share/nginx/html;
    # "Server: nginx" without the version
    server_tokens off;

    # Forward API calls to the agent; the trailing slash removes the /api prefix.
    # The agent sets its own security headers (agent.security).
    location /api/ {
        proxy_pass http://agent:8400/;
        proxy_set_header Host $host;
        client_max_body_size 20m;
    }

    # Vite's content-hashed build output: a changed file gets a new name
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Always revalidated, so a new release's asset names are picked up at once
    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store" always;
    }

    # Single-page app: every unknown path loads index.html, React Router takes over.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri /index.html;
    }
}
