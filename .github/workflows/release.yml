# Release (ADR-016): every push to main builds, scans, pushes, signs and attests each
# service image, then opens an auto-merging PR in o2c-gitops that deploys the new digests
# to dev. Images are tagged with the commit SHA only (no latest) and deployed by digest.
# Every action is pinned to a commit SHA (version in the comment, updated by Dependabot).
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

# A release is never cancelled half-way (pushed but unsigned); runs queue instead
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  TRIVY_IMAGE: aquasec/trivy:0.76.1@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c
  COSIGN_VERSION: v3.1.3
  SYFT_VERSION: v1.54.1

jobs:
  images:
    name: release ${{ matrix.name }}
    # workflow_dispatch can pick any branch; only main is released (verify_image.sh
    # accepts only signatures of release.yml on main)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write # push images to ghcr.io (and pull the model artifacts)
      id-token: write # keyless signing (cosign) and attestations (Sigstore)
      attestations: write # SBOM and build provenance attestations
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: intake, file: docker/python-service.Dockerfile, package: intake }
          - { name: classifier, file: docker/python-service.Dockerfile, package: classifier, model: o2c-doc-classifier }
          - { name: extractor, file: docker/python-service.Dockerfile, package: extractor }
          - { name: agent, file: docker/python-service.Dockerfile, package: agent, model: o2c-quantity-anomaly }
          - { name: analytics-sink, file: docker/python-service.Dockerfile, package: analytics-sink }
          - { name: audit-archiver, file: docker/python-service.Dockerfile, package: audit-archiver }
          - { name: erp-mock, file: services/erp-mock/Dockerfile }
          - { name: ui, file: ui/Dockerfile }
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/o2c-${{ matrix.name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Model artifact from models.lock.json
        id: model
        if: matrix.model
        env:
          MODEL: ${{ matrix.model }}
        run: |
          ref=$(jq -er --arg m "$MODEL" \
            '.models[] | select(.name == $m) | .repository + "@" + .digest' models.lock.json) \
            || { echo "::error::$MODEL is not in models.lock.json (make models-publish)"; exit 1; }
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "Baking $MODEL: $ref" >> "$GITHUB_STEP_SUMMARY"

      - name: Build (load for the scan)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.file }}
          build-args: |
            PACKAGE=${{ matrix.package }}
            MODEL_REF=${{ steps.model.outputs.ref }}
          secrets: registry_token=${{ secrets.GITHUB_TOKEN }}
          push: false
          load: true
          provenance: false # provenance comes from attest-build-provenance below
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=release-${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=release-${{ matrix.name }}
      - name: Trivy image scan (fails on CRITICAL with a fix available)
        run: >
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock
          -v "$PWD/.trivyignore:/.trivyignore:ro" "$TRIVY_IMAGE"
          image --quiet --scanners vuln --severity CRITICAL --ignore-unfixed
          --exit-code 1 --ignorefile /.trivyignore "$IMAGE:$GITHUB_SHA"
      - name: Push (same build, from the builder cache)
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.file }}
          build-args: |
            PACKAGE=${{ matrix.package }}
            MODEL_REF=${{ steps.model.outputs.ref }}
          secrets: registry_token=${{ secrets.GITHUB_TOKEN }}
          push: true
          provenance: false
          sbom: false # Syft SBOM below, attested to the digest
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=release-${{ matrix.name }}

      - name: SBOM (Syft, SPDX JSON)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.IMAGE }}@${{ steps.push.outputs.digest }}
          format: spdx-json
          output-file: sbom-${{ matrix.name }}.spdx.json
          artifact-name: sbom-${{ matrix.name }}.spdx.json
          syft-version: ${{ env.SYFT_VERSION }}
          upload-release-assets: false
      - name: Attest SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          sbom-path: sbom-${{ matrix.name }}.spdx.json
          push-to-registry: true
          create-storage-record: false # needs artifact-metadata: write (organisations only)
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}
      - name: Sign by digest (cosign keyless, GitHub OIDC)
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"

      - name: Record the digest for the gitops PR
        env:
          NAME: ${{ matrix.name }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          mkdir -p digests
          printf '%s %s %s\n' "$NAME" "$IMAGE" "$DIGEST" > "digests/$NAME"
          echo "$IMAGE@$DIGEST" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.name }}
          path: digests/${{ matrix.name }}
          retention-days: 7
          if-no-files-found: error

  gitops:
    name: deploy to dev (o2c-gitops PR)
    needs: images
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-*
          path: digests
          merge-multiple: true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository_owner }}/o2c-gitops
          ref: main
          path: o2c-gitops
          # Fine-grained token for o2c-gitops only (contents and pull requests: write).
          # Unlike GITHUB_TOKEN, its PR triggers o2c-gitops' own PR checks.
          token: ${{ secrets.GITOPS_TOKEN }}
      - name: Update envs/dev/<service>.yaml (image.repository, image.digest)
        working-directory: o2c-gitops
        run: |
          shopt -s nullglob
          files=(../digests/*)
          [ "${#files[@]}" -gt 0 ] || { echo "::error::no digests"; exit 1; }
          for f in "${files[@]}"; do
            read -r name repository digest < "$f"
            values="envs/dev/$name.yaml"
            [ -f "$values" ] || { echo "::error::$values does not exist"; exit 1; }
            REPOSITORY="$repository" DIGEST="$digest" \
              yq -i '.image.repository = strenv(REPOSITORY) | .image.digest = strenv(DIGEST)' "$values"
          done
          git diff --stat
      - name: Open the PR and enable auto-merge
        working-directory: o2c-gitops
        env:
          GH_TOKEN: ${{ secrets.GITOPS_TOKEN }}
          SOURCE_REPO: ${{ github.repository }}
        run: |
          if git diff --quiet; then
            echo "dev already runs these digests"
            exit 0
          fi
          short="${GITHUB_SHA::12}"
          branch="release/dev-$short"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git commit -am "chore(dev): deploy o2c-app $short"
          git push origin "$branch"
          url=$(gh pr create --base main --head "$branch" \
            --title "chore(dev): deploy o2c-app $short" \
            --body "Images built, scanned, signed and attested by $GITHUB_SERVER_URL/$SOURCE_REPO/actions/runs/$GITHUB_RUN_ID from $SOURCE_REPO@$GITHUB_SHA. Verify any image with scripts/verify_image.sh in o2c-app.")
          gh pr merge --auto --squash "$url"
          echo "gitops PR: $url" >> "$GITHUB_STEP_SUMMARY"
