# Weekly dependency updates (ADR-015). Minor and patch updates are grouped into one PR
# per ecosystem; major updates come as separate PRs. Every PR runs the full PR gates.
version: 2

updates:
  - package-ecosystem: uv
    directory: "/" # uv.lock of the workspace (libs/*, services/*)
    schedule:
      interval: weekly
    # Ignored updates apply to grouped and single PRs alike; every other package still
    # gets the grouped minor/patch PR below and separate major PRs.
    ignore:
      # Must match the MLflow 2.17.2 server in docker-compose.yml (local/mlflow); upgrade
      # server and client together as a planned change, not as a Dependabot bump.
      - dependency-name: mlflow-skinny
        update-types: ["version-update:semver-major"]
      # MLflow 2.17's transformers flavour breaks on transformers 4.47 and later (E10).
      - dependency-name: transformers
        versions: [">=4.47"]
      # Capped by MLflow 2.17, which does not support pandas 3.
      - dependency-name: pandas
        versions: [">=3"]
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: "/" # pnpm workspace: the lockfile of ui/ is pnpm-lock.yaml at the root
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directories:
      - "/docker"
      - "/services/erp-mock"
      - "/services/hello"
      - "/ui"
      - "/local/mlflow"
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker-compose
    directory: "/"
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
