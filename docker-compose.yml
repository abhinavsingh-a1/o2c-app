x-langfuse-env: &langfuse-env
  DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/langfuse
  SALT: ${LANGFUSE_SALT}
  ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_KEY}
  TELEMETRY_ENABLED: "false"
  CLICKHOUSE_MIGRATION_URL: clickhouse://clickhouse:9000
  CLICKHOUSE_URL: http://clickhouse:8123
  CLICKHOUSE_USER: clickhouse
  CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
  CLICKHOUSE_CLUSTER_ENABLED: "false"
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  REDIS_AUTH: ${REDIS_AUTH}
  LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
  LANGFUSE_S3_EVENT_UPLOAD_REGION: us-east-1
  LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://s3:8333
  LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
  LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
  LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
  LANGFUSE_S3_EVENT_UPLOAD_PREFIX: events/
  LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse
  LANGFUSE_S3_MEDIA_UPLOAD_REGION: us-east-1
  LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://localhost:8333
  LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
  LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
  LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"
  LANGFUSE_S3_MEDIA_UPLOAD_PREFIX: media/

x-pipeline-env: &pipeline-env
  KAFKA_BOOTSTRAP: kafka:19092
  S3_ENDPOINT_URL: http://s3:8333
  S3_ACCESS_KEY: ${S3_ACCESS_KEY}
  S3_SECRET_KEY: ${S3_SECRET_KEY}
  LITELLM_BASE_URL: http://litellm:4000
  # The services read their LiteLLM key from LITELLM_MASTER_KEY (settings field
  # litellm_master_key, kept for now). Classifier, extractor and agent override it with
  # their own virtual key (ml/litellm_keys.py); intake makes no LLM calls.
  LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
  EVENTS_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/o2c
  INTAKE_HMAC_SECRET: ${INTAKE_HMAC_SECRET}

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: o2c
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./local/postgres-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      retries: 10

  kafka:
    image: apache/kafka:4.3.1
    ports:
      - "9092:9092"
      - "29092:29092" # pods in the kind cluster (ADR-017)
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # kafka:19092 Compose services, localhost:9092 the host, host.docker.internal:29092
      # pods in the kind cluster (ADR-017)
      KAFKA_LISTENERS: PLAINTEXT://:19092,CONTROLLER://:9093,PLAINTEXT_HOST://:9092,PLAINTEXT_KIND://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,PLAINTEXT_HOST://localhost:9092,PLAINTEXT_KIND://host.docker.internal:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,PLAINTEXT_KIND:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 3

  s3:
    image: chrislusf/seaweedfs:4.48
    command: server -dir=/data -s3
    ports:
      - "8333:8333"
      - "9333:9333"
    volumes:
      - s3data:/data

  mlflow:
    build: ./local/mlflow
    command: >
      mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/mlflow
      --artifacts-destination s3://mlflow
    environment:
      MLFLOW_S3_ENDPOINT_URL: http://s3:8333
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
      s3:
        condition: service_started
  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    volumes:
      - ./local/litellm/config.yaml:/app/config.yaml
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/litellm
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY}
      LANGFUSE_HOST: http://langfuse-web:3000
      LANGFUSE_BASE_URL: http://langfuse-web:3000
      LANGFUSE_OTEL_HOST: http://langfuse-web:3000
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy

  clickhouse:
    image: clickhouse/clickhouse-server:26.6
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
    volumes:
      - chdata:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

  redis:
    image: redis:7
    command: redis-server --requirepass ${REDIS_AUTH} --maxmemory-policy noeviction

  langfuse-worker:
    image: langfuse/langfuse-worker:3
    environment: *langfuse-env
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_started
      redis:
        condition: service_started

  langfuse-web:
    image: langfuse/langfuse:3
    ports:
      - "3000:3000"
    environment:
      <<: *langfuse-env
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET}
      LANGFUSE_INIT_ORG_ID: o2c
      LANGFUSE_INIT_ORG_NAME: O2C
      LANGFUSE_INIT_PROJECT_ID: o2c-local
      LANGFUSE_INIT_PROJECT_NAME: o2c-local
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANGFUSE_SECRET_KEY}
      LANGFUSE_INIT_USER_EMAIL: ${LANGFUSE_ADMIN_EMAIL}
      LANGFUSE_INIT_USER_NAME: admin
      LANGFUSE_INIT_USER_PASSWORD: ${LANGFUSE_ADMIN_PASSWORD}

      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY}
      LANGFUSE_HOST: http://langfuse-web:3000

    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_started
      redis:
        condition: service_started

  erp-mock:
    build:
      context: .
      dockerfile: services/erp-mock/Dockerfile
    environment:
      ERP_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/erp
    ports:
      - "8100:8100"
    depends_on:
      postgres:
        condition: service_healthy

  intake:
    build:
      context: .
      dockerfile: docker/python-service.Dockerfile
      args:
        PACKAGE: intake
    # 2 workers; bind, workers and the Prometheus multiprocess hooks: intake/gunicorn_conf.py
    command: gunicorn -c python:intake.gunicorn_conf "intake.app:create_app()"
    environment:
      <<: *pipeline-env
      PROMETHEUS_MULTIPROC_DIR: /tmp/prometheus-intake # metrics of both workers (ADR-012)
    ports:
      - "8200:8200"
    depends_on:
      kafka:
        condition: service_started
      s3:
        condition: service_started

  classifier:
    build:
      context: .
      dockerfile: docker/python-service.Dockerfile
      args:
        PACKAGE: classifier
    command: python -m classifier.app
    environment:
      <<: *pipeline-env
      LITELLM_MASTER_KEY: ${LITELLM_KEY_CLASSIFIER:-${LITELLM_MASTER_KEY}} # own virtual key
      MLFLOW_TRACKING_URI: http://mlflow:5000 # DistilBERT classifier; GPT only if unavailable
    depends_on:
      kafka:
        condition: service_started
      s3:
        condition: service_started
      litellm:
        condition: service_started
      postgres:
        condition: service_healthy

  extractor:
    build:
      context: .
      dockerfile: docker/python-service.Dockerfile
      args:
        PACKAGE: extractor
    command: uvicorn extractor.app:create_app --factory --host 0.0.0.0 --port 8300
    environment:
      <<: *pipeline-env
      LITELLM_MASTER_KEY: ${LITELLM_KEY_EXTRACTOR:-${LITELLM_MASTER_KEY}} # own virtual key
    ports:
      - "8300:8300"
    depends_on:
      kafka:
        condition: service_started
      s3:
        condition: service_started
      litellm:
        condition: service_started
      postgres:
        condition: service_healthy

  agent:
    build:
      context: .
      dockerfile: docker/python-service.Dockerfile
      args:
        PACKAGE: agent
    command: uvicorn agent.app:create_app --factory --host 0.0.0.0 --port 8400
    environment:
      <<: *pipeline-env
      LITELLM_MASTER_KEY: ${LITELLM_KEY_AGENT:-${LITELLM_MASTER_KEY}} # own virtual key
      ERP_BASE_URL: http://erp-mock:8100
      MLFLOW_TRACKING_URI: http://mlflow:5000 # quantity anomaly model; scores 0.0 if unavailable
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET}
      AUTH_USERS_FILE: /app/local/users.json
    ports:
      - "8400:8400"
    volumes:
      - ./local/users.json:/app/local/users.json:ro
    depends_on:
      kafka:
        condition: service_started
      litellm:
        condition: service_started
      erp-mock:
        condition: service_started
      postgres:
        condition: service_healthy
  analytics-sink:
    # Events, DLQ and LiteLLM spend logs -> raw.* for the dbt marts (ADR-013)
    build:
      context: .
      dockerfile: docker/python-service.Dockerfile
      args:
        PACKAGE: analytics-sink
    command: python -m analytics_sink.app
    environment:
      <<: *pipeline-env
      LITELLM_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/litellm
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD} # read-only role grafana_ro
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_started
      postgres:
        condition: service_healthy

  audit-archiver:
    # Decisions and review decisions -> hash-chained JSONL in s3://o2c-audit (ADR-014)
    build:
      context: .
      dockerfile: docker/python-service.Dockerfile
      args:
        PACKAGE: audit-archiver
    command: python -m audit_archiver.app
    environment:
      <<: *pipeline-env
      AUDIT_BUCKET: o2c-audit # created by make buckets
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_started
      s3:
        condition: service_started
      postgres:
        condition: service_healthy

  # --- Observability (ADR-012) ---
  prometheus:
    image: prom/prometheus:v3.15.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle # POST /-/reload after changing the config or alerts
    volumes:
      - ./observability/prometheus:/etc/prometheus:ro
      - promdata:/prometheus
    ports:
      - "9090:9090"

  kafka-exporter:
    # Consumer lag per group and topic offsets (DLQ). Restarts until Kafka is reachable.
    image: danielqsj/kafka-exporter:v1.10.0
    command: ["--kafka.server=kafka:19092"]
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_started

  grafana:
    image: grafana/grafana:13.2.4
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      # Password of the read-only database role grafana_ro (analytics datasource, ADR-013)
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/o2c-operations.json
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    ports:
      - "3001:3000" # 3000 is Langfuse
    depends_on:
      prometheus:
        condition: service_started

  ui:
    build:
      context: .
      dockerfile: ui/Dockerfile
    ports:
      - "5180:8080"
    depends_on:
      agent:
        condition: service_started

volumes:
  pgdata:
  s3data:
  chdata:
  promdata:
  grafanadata:
