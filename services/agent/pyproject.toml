[project]
name = "agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Abhinav", email = "a1.abhinavsingh@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.43.115",
    "fastapi>=0.149.0",
    "httpx>=0.28.1",
    "langchain-openai>=1.7.2",
    "langchain-postgres>=0.0.19",
    "langchain-text-splitters>=1.1.3",
    "langgraph>=1.2.15",
    "langgraph-checkpoint-postgres>=3.2.0",
    "mlflow-skinny==2.17.2",
    "o2c-common",
    "pandas>=3.0.6,<4",
    "psycopg[binary,pool]>=3.3.6",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.0",
    "pyjwt>=2.15.1",
    "scikit-learn>=1.9.1",
    "uvicorn>=0.54.0",
]

[project.scripts]
agent = "agent:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[tool.uv.sources]
o2c-common = { workspace = true }
